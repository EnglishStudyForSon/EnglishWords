<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>3D 单词飞行</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#87CEEB;font-family:'Segoe UI',sans-serif}
#c{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;height:clamp(48px,8vh,72px);background:linear-gradient(180deg,rgba(0,0,0,.6),transparent);display:flex;justify-content:space-between;align-items:flex-start;padding:8px 12px;z-index:10;pointer-events:none}
#hud .left,#hud .right{display:flex;flex-direction:column;gap:2px}
#hud .w{color:#fff;font-size:clamp(18px,3.4vh,26px);font-weight:bold;text-shadow:2px 2px 0 rgba(0,0,0,.8);letter-spacing:2px}
#hud .s{color:#fbd000;font-size:clamp(12px,2.2vh,16px);text-shadow:1px 1px 0 rgba(0,0,0,.8)}
#hud .lives{color:#ff6b6b;font-size:clamp(13px,2.4vh,18px);letter-spacing:3px;text-shadow:1px 1px 0 rgba(0,0,0,.8)}
#hud .lv{color:#fff;font-size:clamp(13px,2.4vh,18px);text-shadow:1px 1px 0 rgba(0,0,0,.8)}
#btnHint{position:absolute;top:clamp(50px,8vh,76px);right:12px;z-index:10;width:clamp(40px,6vh,52px);height:clamp(40px,6vh,52px);border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:#fff;font-size:clamp(18px,3vh,24px);cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-tap-highlight-color:transparent}
#btnHint:active{background:rgba(251,208,0,.4)}
#crosshair{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(36px,5vh,52px);height:clamp(36px,5vh,52px);pointer-events:none;z-index:9}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(255,255,255,.85);box-shadow:0 0 4px rgba(0,0,0,.8)}
#crosshair::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%)}
#crosshair::after{top:50%;left:0;height:2px;width:100%;transform:translateY(-50%)}
#crosshair .dot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;background:rgba(251,208,0,.9);box-shadow:0 0 6px rgba(251,208,0,.8)}
#crosshair.locked .dot{background:#4caf50;box-shadow:0 0 10px #4caf50}
#toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;pointer-events:none;text-align:center;opacity:0;transition:opacity .3s}
#toast.show{opacity:1}
#toast .big{font-size:clamp(40px,10vh,80px);font-weight:bold;color:#fff;text-shadow:3px 3px 0 rgba(0,0,0,.8),0 0 30px rgba(251,208,0,.6)}
#toast .sub{font-size:clamp(20px,5vh,36px);color:#fbd000;text-shadow:2px 2px 0 rgba(0,0,0,.8)}
#panel{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.75);gap:clamp(14px,3vh,24px)}
#panel .title{font-size:clamp(28px,6vh,48px);color:#fbd000;font-weight:bold;text-shadow:3px 3px 0 rgba(0,0,0,.9)}
#panel .desc{color:#fff;font-size:clamp(13px,2.6vh,18px);text-align:center;line-height:1.8;padding:0 24px}
#panel .btn{padding:clamp(10px,2vh,16px) clamp(30px,6vw,60px);font-size:clamp(16px,3.2vh,22px);border:none;border-radius:12px;background:#fbd000;color:#333;font-weight:bold;cursor:pointer;box-shadow:0 4px 0 #a88900}
#panel .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a88900}
#controls{position:absolute;bottom:clamp(16px,3vh,30px);left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:end;padding:0 clamp(10px,2vw,20px);pointer-events:none}
#controls button{pointer-events:auto;width:clamp(56px,9vh,80px);height:clamp(56px,9vh,80px);border-radius:50%;border:3px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;font-size:clamp(14px,2.4vh,18px);font-weight:bold;touch-action:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
#controls .grp{display:flex;gap:clamp(8px,1.5vh,14px)}
#controls button:active{background:rgba(251,208,0,.3)}
#win{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(0,0,0,.7),rgba(0,0,0,.9));gap:clamp(12px,2.5vh,20px)}
#win .t{font-size:clamp(32px,7vh,56px);color:#fbd000;font-weight:bold;text-shadow:3px 3px 0 rgba(0,0,0,.9)}
#win .st{font-size:clamp(16px,3.4vh,26px);color:#fff}
#win .btn{padding:clamp(10px,2vh,16px) clamp(30px,6vw,60px);font-size:clamp(16px,3.2vh,22px);border:none;border-radius:12px;background:#fbd000;color:#333;font-weight:bold;cursor:pointer;box-shadow:0 4px 0 #a88900}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="crosshair"><div class="dot"></div></div>
<div id="hud">
  <div class="left">
    <div class="w" id="word">apple</div>
    <div class="s" id="zh">苹果</div>
  </div>
  <div class="right">
    <div class="lv" id="lv">1 / 10</div>
    <div class="lives" id="lives">❤❤❤❤❤</div>
  </div>
</div>
<button id="btnHint">🔊</button>
<div id="toast"><div class="big" id="toastBig"></div><div class="sub" id="toastSub"></div></div>
<div id="panel">
  <div class="title">✈️ 3D 单词飞行</div>
  <div class="desc">操控飞机按顺序穿过字母拼出单词，最后飞过终点门过关。<br>键盘: ↑↓←→ / WASD　触屏: 屏幕左右两侧拖拽或按钮</div>
  <button class="btn" id="btnStart">开始飞行</button>
</div>
<div id="controls">
  <div class="grp">
    <button id="btnUp">▲</button>
    <button id="btnDown">▼</button>
  </div>
  <div class="grp">
    <button id="btnLeft">◀</button>
    <button id="btnRight">▶</button>
  </div>
</div>
<div id="win">
  <div class="t">🎉 全部通关!</div>
  <div class="st" id="winStat"></div>
  <button class="btn" id="btnAgain">再来一次</button>
</div>

<script src="three.min.js"></script>
<script>
// ===== 词库 =====
const WORDS=[
  {en:'apple',zh:'苹果'},{en:'banana',zh:'香蕉'},{en:'grape',zh:'葡萄'},{en:'lemon',zh:'柠檬'},
  {en:'mango',zh:'芒果'},{en:'orange',zh:'桔子'},{en:'peach',zh:'桃子'},{en:'pear',zh:'梨'},
  {en:'carrot',zh:'胡萝卜'},{en:'corn',zh:'玉米'},{en:'onion',zh:'洋葱'},{en:'peas',zh:'豌豆'},
  {en:'cat',zh:'猫'},{en:'dog',zh:'狗'},{en:'bird',zh:'鸟'},{en:'rabbit',zh:'兔子'},
  {en:'turtle',zh:'乌龟'},{en:'spider',zh:'蜘蛛'},{en:'france',zh:'法国'},{en:'china',zh:'中国'},
  {en:'hotel',zh:'酒店'},{en:'bank',zh:'银行'},{en:'hospital',zh:'医院'},{en:'school',zh:'学校'},
  {en:'teacher',zh:'老师'},{en:'farmer',zh:'农民'},{en:'doctor',zh:'医生'},{en:'driver',zh:'司机'},
  {en:'nurse',zh:'护士'},{en:'worker',zh:'工人'},{en:'bedroom',zh:'卧室'},{en:'kitchen',zh:'厨房'},
  {en:'table',zh:'桌子'},{en:'photo',zh:'照片'},{en:'paper',zh:'纸'},{en:'bag',zh:'包'},
  {en:'kind',zh:'友好的'},{en:'quiet',zh:'文静的'},{en:'strong',zh:'强壮的'},{en:'careful',zh:'细心的'},
  {en:'sleep',zh:'睡觉'},{en:'visit',zh:'拜访'},{en:'show',zh:'演出'},{en:'hear',zh:'听到'},
  {en:'behind',zh:'在后面'},{en:'beside',zh:'在旁边'},{en:'always',zh:'总是'},{en:'keep',zh:'保持'}
];

// ===== 常量 =====
const SPEED=12;            // forward speed
const MAXLIVES=5;
const PER=10;              // words per level

// ===== 状态 =====
let game={playing:false,idx:0,lives:MAXLIVES,score:0,errs:0,level:1,word:null,got:[],spawned:false,finishSpawned:false,win:false,paused:false};

// ===== three.js 场景 =====
let scene,camera,renderer,plane,clouds=[],letters=[],letterMats={},gate=null,terrain;
let key={up:false,down:false,left:false,right:false};
let touch={up:false,down:false,left:false,right:false};

function initThree(){
  const canvas=document.getElementById('c');
  renderer=new THREE.WebGLRenderer({canvas,antialias:true});
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x87CEEB);
  scene.fog=new THREE.Fog(0x87CEEB,120,400);

  camera=new THREE.PerspectiveCamera(70,window.innerWidth/window.innerHeight,0.1,800);
  camera.position.set(0,8,30);
  camera.lookAt(0,4,0);

  // lights
  const amb=new THREE.AmbientLight(0xffffff,0.6);
  scene.add(amb);
  const dir=new THREE.DirectionalLight(0xffffff,1.0);
  dir.position.set(50,100,30);
  scene.add(dir);

  buildTerrain();
  buildPlane();
  buildClouds();

  window.addEventListener('resize',()=>{
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
  });
}

function buildTerrain(){
  // ground
  const ground=new THREE.Mesh(
    new THREE.PlaneGeometry(2000,2000),
    new THREE.MeshLambertMaterial({color:0x4CAF50})
  );
  ground.rotation.x=-Math.PI/2;
  ground.position.y=-2;
  scene.add(ground);
  terrain=ground;

  // grid helper
  const grid=new THREE.GridHelper(2000,100,0x66BB6A,0x66BB6A);
  grid.position.y=-1.8;
  grid.material.opacity=.3;
  grid.material.transparent=true;
  scene.add(grid);

  // some hills
  const hillGeo=new THREE.ConeGeometry(15,12,8);
  const hillMat=new THREE.MeshLambertMaterial({color:0x66BB6A});
  for(let i=0;i<30;i++){
    const h=new THREE.Mesh(hillGeo,hillMat);
    h.position.set((Math.random()-0.5)*800,4,(Math.random()-0.5)*800-200);
    h.scale.set(0.5+Math.random(),0.5+Math.random(),0.5+Math.random());
    scene.add(h);
  }
}

function buildClouds(){
  const mat=new THREE.MeshLambertMaterial({color:0xffffff});
  for(let i=0;i<40;i++){
    const g=new THREE.Group();
    const n=3+Math.floor(Math.random()*3);
    for(let j=0;j<n;j++){
      const s=new THREE.Mesh(new THREE.SphereGeometry(4+Math.random()*4,8,8),mat);
      s.position.set(j*4-4,Math.random()*2,j*Math.random()*2);
      g.add(s);
    }
    g.position.set((Math.random()-0.5)*900,30+Math.random()*60,(Math.random()-0.5)*900-300);
    g.userData.speed=0.2+Math.random()*0.5;
    scene.add(g);
    clouds.push(g);
  }
}

function buildPlane(){
  plane=new THREE.Group();
  const bodyMat=new THREE.MeshPhongMaterial({color:0xE53935});
  const wingMat=new THREE.MeshPhongMaterial({color:0x1E88E5});
  const darkMat=new THREE.MeshPhongMaterial({color:0x333});

  // fuselage
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.8,0.5,5,8),bodyMat);
  body.rotation.x=Math.PI/2;
  plane.add(body);

  // nose cone (pointing +Z, flight direction)
  const nose=new THREE.Mesh(new THREE.ConeGeometry(0.8,1.4,8),bodyMat);
  nose.rotation.x=Math.PI/2;
  nose.position.z=3.2;
  plane.add(nose);

  // cockpit
  const cockpit=new THREE.Mesh(new THREE.SphereGeometry(0.7,8,8),new THREE.MeshPhongMaterial({color:0x4FC3F7,transparent:true,opacity:.8}));
  cockpit.position.set(0,0.8,0.3);
  cockpit.scale.y=0.7;
  plane.add(cockpit);

  // main wings
  const wing=new THREE.Mesh(new THREE.BoxGeometry(6,0.2,1.6),wingMat);
  wing.position.y=0;
  plane.add(wing);

  // tail wings
  const tailW=new THREE.Mesh(new THREE.BoxGeometry(2,0.15,0.8),wingMat);
  tailW.position.set(0,0.2,-2.2);
  plane.add(tailW);
  const tailV=new THREE.Mesh(new THREE.BoxGeometry(0.15,1.2,0.8),darkMat);
  tailV.position.set(0,0.7,-2.4);
  plane.add(tailV);

  // propeller
  const prop=new THREE.Group();
  const b1=new THREE.Mesh(new THREE.BoxGeometry(2.4,0.15,0.1),darkMat);
  const b2=new THREE.Mesh(new THREE.BoxGeometry(0.15,2.4,0.1),darkMat);
  prop.add(b1);prop.add(b2);
  prop.position.z=3.9;
  plane.add(prop);
  plane.userData.prop=prop;

  plane.position.set(0,8,0);
  scene.add(plane);
}

// ===== 字母 =====
function makeLetterMat(ch,color){
  if(letterMats[ch])return letterMats[ch];
  const cv=document.createElement('canvas');
  cv.width=cv.height=128;
  const ctx=cv.getContext('2d');
  ctx.fillStyle=color;
  ctx.fillRect(0,0,128,128);
  ctx.strokeStyle='rgba(255,255,255,.6)';
  ctx.lineWidth=6;
  ctx.strokeRect(3,3,122,122);
  ctx.fillStyle='#fff';
  ctx.font='bold 80px Arial';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(ch.toUpperCase(),64,66);
  const tex=new THREE.CanvasTexture(cv);
  tex.needsUpdate=true;
  letterMats[ch]=new THREE.MeshLambertMaterial({map:tex});
  return letterMats[ch];
}

function spawnLetters(){
  letters.forEach(l=>scene.remove(l));
  letters=[];
  if(!game.word)return;
  const w=game.word.en;
  const n=w.length;
  const spacing=8;
  for(let i=0;i<n;i++){
    const ch=w[i];
    const isSpace=ch===' ';
    const mat=isSpace?new THREE.MeshLambertMaterial({color:0x9E9E9E}):makeLetterMat(ch,0x1E88E5);
    const g=new THREE.Mesh(new THREE.BoxGeometry(5,5,1.4),mat);
    if(!isSpace){
      const label=makeLetterMesh(ch);
      label.scale.set(2.8,2.8,1);
      label.position.z=0.8;
      g.add(label);
    }
    // arc formation
    const totalSpan=(n-1)*spacing;
    const x=i*spacing-totalSpan/2;
    const y=Math.sin((i/(n-1)-0.5)*Math.PI)*9+4;
    g.position.set(x,y,0);
    g.userData={idx:i,letter:ch,collected:false,spawned:false};
    scene.add(g);
    letters.push(g);
  }
}

function makeLetterMesh(ch){
  if(ch===' ')return null;
  const cv=document.createElement('canvas');
  cv.width=cv.height=128;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#fff';
  ctx.font='bold 96px Arial';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(ch.toUpperCase(),64,66);
  const tex=new THREE.CanvasTexture(cv);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(1.8,1.8),new THREE.MeshBasicMaterial({map:tex,transparent:true}));
  return m;
}

// ===== 终点门 =====
function spawnGate(){
  if(gate){scene.remove(gate);gate=null}
  const g=new THREE.Group();
  const pillarMat=new THREE.MeshLambertMaterial({color:0x8D6E63});
  const p1=new THREE.Mesh(new THREE.BoxGeometry(1.5,14,1.5),pillarMat);
  p1.position.x=-6;
  const p2=new THREE.Mesh(new THREE.BoxGeometry(1.5,14,1.5),pillarMat);
  p2.position.x=6;
  const top=new THREE.Mesh(new THREE.BoxGeometry(15,2,1.5),pillarMat);
  top.position.y=7;
  g.add(p1,p2,top);

  // banner
  const cv=document.createElement('canvas');
  cv.width=512;cv.height=128;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#fbd000';
  ctx.fillRect(0,0,512,128);
  ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.strokeRect(4,4,504,120);
  ctx.fillStyle='#333';
  ctx.font='bold 56px Arial';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('GOAL',256,66);
  const banner=new THREE.Mesh(
    new THREE.PlaneGeometry(14,3.5),
    new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv)})
  );
  banner.position.y=2;
  banner.position.z=0.8;
  g.add(banner);

  g.position.set(0,4,0);
  scene.add(g);
  gate=g;
}

// ===== 音频 =====
let actx=null;
function beep(freq,dur,type='square',vol=0.15){
  try{
    if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(vol,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur);
    o.connect(g);g.connect(actx.destination);
    o.start();o.stop(actx.currentTime+dur);
  }catch(e){}
}
function sCollect(){beep(660,0.12,'square');setTimeout(()=>beep(880,0.15,'square'),80)}
function sError(){beep(180,0.3,'sawtooth',0.2)}
function sPass(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.18,'square'),i*120))}
function sFail(){[400,300,200].forEach((f,i)=>setTimeout(()=>beep(f,0.25,'sawtooth',0.2),i*150))}

// ===== 语音 =====
function speak(text){
  try{
    if(!('speechSynthesis' in window))return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';u.rate=0.9;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

// ===== 游戏流程 =====
function startGame(){
  document.getElementById('panel').style.display='none';
  document.getElementById('win').style.display='none';
  game={playing:true,idx:0,lives:MAXLIVES,score:0,errs:0,level:1,word:null,got:[],spawned:false,finishSpawned:false,win:false,paused:false};
  plane.position.set(0,8,0);
  nextWord();
  loop();
}

function nextWord(){
  if(game.idx>=WORDS.length){showWin();return}
  game.word=WORDS[game.idx];
  game.got=[];
  game.spawned=false;
  game.finishSpawned=false;
  document.getElementById('word').textContent=game.word.en;
  document.getElementById('zh').textContent=game.word.zh;
  document.getElementById('lv').textContent=(game.idx%PER+1)+' / '+PER;
  speak(game.word.en);
  letters.forEach(l=>scene.remove(l));
  letters=[];
  if(gate){scene.remove(gate);gate=null}
}

function spawnWordField(){
  if(game.spawned||!game.word)return;
  game.spawned=true;
  spawnLetters();
  const n=game.word.en.length;
  // adaptive spacing so the whole field fits in view (max total span ~70 units)
  const spacing=Math.min(18,n>1?70/(n-1):18);
  const baseX=plane.position.x;
  const baseZ=plane.position.z+160;  // place ahead of plane
  const totalSpan=(n-1)*spacing;
  letters.forEach((l,i)=>{
    l.position.set(
      baseX+i*spacing-totalSpan/2,
      Math.sin((i/(n-1)-0.5)*Math.PI)*8+plane.position.y+4,
      baseZ
    );
  });
}

function update(dt){
  if(!game.playing||game.paused)return;

  // controls
  const up=key.up||touch.up,down=key.down||touch.down,lft=key.left||touch.left,rig=key.right||touch.right;
  const dx=(lft?1:0)-(rig?1:0);
  const dy=(up?1:0)-(down?1:0);

  // bank angle based on lateral movement
  const targetRoll=dx*-0.4;
  plane.rotation.z+=(targetRoll-plane.rotation.z)*Math.min(1,dt*5);
  const targetPitch=dy*-0.25;
  plane.rotation.x+=(targetPitch-plane.rotation.x)*Math.min(1,dt*5);

  plane.position.x+=dx*10*dt;
  plane.position.y+=dy*8*dt;
  plane.position.y=Math.max(1.5,Math.min(50,plane.position.y));
  plane.position.x=Math.max(-90,Math.min(90,plane.position.x));
  plane.position.z+=SPEED*dt;

  // propeller spin
  if(plane.userData.prop)plane.userData.prop.rotation.z+=30*dt;

  // camera follows
  camera.position.x+=(plane.position.x-camera.position.x)*Math.min(1,dt*3);
  camera.position.y+=(plane.position.y+5-camera.position.y)*Math.min(1,dt*3);
  camera.position.z=plane.position.z-22;
  camera.lookAt(plane.position.x,plane.position.y+2,plane.position.z+30);

  // clouds drift
  clouds.forEach(c=>{c.position.x+=c.userData.speed*dt;if(c.position.x>500)c.position.x=-500});

  // letter spawn trigger
  if(!game.spawned&&plane.position.z>10)spawnWordField();

  // if plane passed all letters without finishing the word, respawn ahead (retry)
  if(game.spawned&&letters.length>0&&!game.finishSpawned){
    const lastLetterZ=Math.max(...letters.map(l=>l.position.z));
    if(plane.position.z>lastLetterZ+30){
      // missed letters — respawn a fresh field ahead
      game.spawned=false;
      game.finishSpawned=false;
      letters.forEach(l=>scene.remove(l));
      letters=[];
      setTimeout(()=>{if(game.playing)spawnWordField()},300);
    }
  }

  // finish gate spawn: after all letters collected or near end
  if(game.got.length===game.word.en.length&&!game.finishSpawned){
    game.finishSpawned=true;
    spawnGate();
    // place gate just past the last letter
    gate.position.set(plane.position.x,plane.position.y+4,plane.position.z+180);
    sPass();
    showToast('拼完啦!','飞过终点门!');
  }

  // highlight the NEXT target letter (pulse) + crosshair lock
  let nextExpected=game.word.en[game.got.length];
  let locked=false;
  letters.forEach(l=>{
    if(l.userData.collected)return;
    if(l.userData.letter===nextExpected){
      const pulse=1+0.15*Math.sin(performance.now()/180);
      l.scale.set(pulse,pulse,1);
    }else{
      l.scale.set(1,1,1);
    }
    // crosshair lock when this letter is close to screen center
    const v=l.position.clone().project(camera);
    if(Math.abs(v.x)<0.08&&Math.abs(v.y)<0.08&&v.z<1)locked=true;
  });
  document.getElementById('crosshair').classList.toggle('locked',locked);

  // collision: letters
  letters.forEach(l=>{
    if(l.userData.collected)return;
    const dxP=l.position.x-plane.position.x;
    const dyP=l.position.y-plane.position.y;
    const dzP=l.position.z-plane.position.z;
    const dist=Math.sqrt(dxP*dxP+dyP*dyP+dzP*dzP);
    if(dist<5.5){
      const expected=game.word.en[game.got.length];
      if(l.userData.letter===expected){
        // correct
        l.userData.collected=true;
        game.got.push(l.userData.letter);
        game.score+=10;
        sCollect();
        // pop animation
        l.scale.set(2,2,2);
        setTimeout(()=>{scene.remove(l)},200);
        const idx=game.got.length;
        const el=document.getElementById('word');
        el.textContent=game.word.en.slice(0,idx);
        showToast(game.word.en[idx-1],'✓');
        if(game.got.length===game.word.en.length){
          game.score+=50;
        }
      }else{
        // wrong letter
        game.lives--;
        game.errs++;
        sError();
        showToast('✗','顶错字母!');
        flashRed();
        l.material.color.setHex(0xff0000);
        setTimeout(()=>{if(l.material.color)l.material.color.setHex(0x1E88E5)},300);
        document.getElementById('lives').textContent='❤'.repeat(Math.max(0,game.lives))+'🖤'.repeat(Math.max(0,MAXLIVES-game.lives));
        if(game.lives<=0){
          game.playing=false;
          sFail();
          setTimeout(()=>showGameOver(),600);
        }
      }
    }
  });

  // gate collision
  if(gate){
    const gz=gate.position.z;
    const gx=gate.position.x;
    const gy=gate.position.y;
    if(Math.abs(plane.position.z-gz)<5&&Math.abs(plane.position.x-gx)<8&&Math.abs(plane.position.y-gy)<9){
      if(game.got.length===game.word.en.length&&!game.win){
        game.win=true;
        game.playing=false;
        sPass();
        setTimeout(()=>{
          game.idx++;
          game.win=false;
          if(game.idx>=WORDS.length){showWin()}
          else{nextWord();game.playing=true}
        },800);
      }
    }
  }
}

function flashRed(){
  scene.background=new THREE.Color(0xff4444);
  setTimeout(()=>{scene.background=new THREE.Color(0x87CEEB)},200);
}

function showToast(big,sub){
  const t=document.getElementById('toast');
  document.getElementById('toastBig').textContent=big;
  document.getElementById('toastSub').textContent=sub||'';
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t=setTimeout(()=>t.classList.remove('show'),900);
}

function showGameOver(){
  document.getElementById('panel').style.display='flex';
  document.getElementById('panel').querySelector('.title').textContent='💔 游戏结束';
  document.getElementById('panel').querySelector('.desc').innerHTML='正确 '+(game.score/10)+' 个字母，失误 '+game.errs+' 次<br>得分: '+game.score;
  document.getElementById('btnStart').textContent='重新开始';
  document.getElementById('btnStart').onclick=startGame;
}

function showWin(){
  document.getElementById('panel').style.display='none';
  const win=document.getElementById('win');
  win.style.display='flex';
  document.getElementById('winStat').textContent='得分: '+game.score+'　失误: '+game.errs+' 次';
  document.getElementById('btnAgain').onclick=startGame;
  game.playing=false;
}

// ===== 主循环 =====
let lastT=performance.now();
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(t-lastT)/1000)||0.016;
  lastT=t;
  update(dt);
  renderer.render(scene,camera);
}

// ===== 输入 =====
function setupInput(){
  window.addEventListener('keydown',e=>{
    if(e.key==='ArrowUp'||e.key==='w'||e.key==='W')key.up=true;
    if(e.key==='ArrowDown'||e.key==='s'||e.key==='S')key.down=true;
    if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')key.left=true;
    if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')key.right=true;
  });
  window.addEventListener('keyup',e=>{
    if(e.key==='ArrowUp'||e.key==='w'||e.key==='W')key.up=false;
    if(e.key==='ArrowDown'||e.key==='s'||e.key==='S')key.down=false;
    if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')key.left=false;
    if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')key.right=false;
  });

  // touch buttons
  const bind=(id,k)=>{
    const b=document.getElementById(id);
    b.addEventListener('touchstart',e=>{e.preventDefault();touch[k]=true},{passive:false});
    b.addEventListener('touchend',e=>{e.preventDefault();touch[k]=false},{passive:false});
    b.addEventListener('touchcancel',e=>{touch[k]=false},{passive:false});
    b.addEventListener('mousedown',()=>{touch[k]=true});
    b.addEventListener('mouseup',()=>{touch[k]=false});
    b.addEventListener('mouseleave',()=>{touch[k]=false});
  };
  bind('btnUp','up');bind('btnDown','down');bind('btnLeft','left');bind('btnRight','right');

  // mouse drag steering (desktop fallback)
  let dragging=false,lastX=0,lastY=0;
  const cv=document.getElementById('c');
  cv.addEventListener('mousedown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY});
  window.addEventListener('mousemove',e=>{
    if(!dragging)return;
    key.left=false;key.right=false;key.up=false;key.down=false;
    if(e.clientX<lastX-5)key.left=true;
    if(e.clientX>lastX+5)key.right=true;
    if(e.clientY<lastY-5)key.up=true;
    if(e.clientY>lastY+5)key.down=true;
    lastX=e.clientX;lastY=e.clientY;
  });
  window.addEventListener('mouseup',()=>{dragging=false;key.left=key.right=key.up=key.down=false});

  // hint button
  const bh=document.getElementById('btnHint');
  bh.addEventListener('click',()=>{if(game.word){speak(game.word.en);showToast(game.word.en,game.word.zh)}});

  // start
  document.getElementById('btnStart').addEventListener('click',startGame);
}

// ===== 启动 =====
initThree();
setupInput();
document.getElementById('btnStart').onclick=startGame;
</script>
