<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>英语游戏中心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(160deg,#1a237e,#4a148c);font-family:'Segoe UI',sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center;padding:clamp(16px,4vh,40px)}
h1{font-size:clamp(22px,4.5vh,36px);margin-bottom:clamp(12px,3vh,24px);text-shadow:3px 3px 0 rgba(0,0,0,.5)}
.sub{font-size:clamp(12px,2.2vh,15px);color:#b39ddb;margin-bottom:clamp(16px,4vh,28px);text-align:center}
#list{width:100%;max-width:860px;display:flex;flex-direction:column;gap:clamp(10px,2.2vh,16px)}
.card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:clamp(14px,3vh,22px);display:flex;align-items:center;gap:clamp(12px,2.5vh,20px);backdrop-filter:blur(4px);cursor:pointer;transition:.15s}
.card:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
.card:active{transform:scale(.98)}
.icon{font-size:clamp(30px,6vh,48px);width:clamp(52px,8vh,70px);height:clamp(52px,8vh,70px);border-radius:14px;background:rgba(251,208,0,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.info{flex:1;min-width:0}
.name{font-size:clamp(16px,3.2vh,22px);font-weight:bold;margin-bottom:3px}
.desc{font-size:clamp(12px,2.2vh,15px);color:#ce93d8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.url{font-size:clamp(10px,1.8vh,12px);color:#7e57c2;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{font-size:clamp(20px,4vh,30px);color:#fbd000;flex-shrink:0}
#viewer{position:fixed;inset:0;background:#000;display:none;z-index:10;flex-direction:column}
#viewer .bar{height:clamp(40px,7vh,56px);background:rgba(0,0,0,.85);display:flex;align-items:center;padding:0 8px;gap:8px}
#viewer .bar button{background:#fbd000;color:#333;border:none;border-radius:8px;padding:6px 14px;font-size:clamp(12px,2.2vh,16px);font-weight:bold;cursor:pointer}
#viewer .bar .t{flex:1;color:#fff;font-size:clamp(13px,2.4vh,18px);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#viewer iframe{flex:1;width:100%;border:none}
</style>
</head>
<body>
<h1>🎮 英语游戏中心</h1>
<div class="sub">选择游戏，点击即玩（在线加载）</div>
<div id="list"></div>

<div id="viewer">
  <div class="bar">
    <button onclick="closeGame()">◀ 返回</button>
    <div class="t" id="viewerTitle"></div>
    <button onclick="openInTab()">↗ 新窗口</button>
  </div>
  <iframe id="frame" allowfullscreen></iframe>
</div>

<script>
// ===== 游戏清单 =====
// url 可以是远程地址（已部署），也可以是同源相对路径
const GAMES=[
  {id:'mario', name:'超级玛丽学单词', icon:'🍄', desc:'顶字母拼单词 · 2D 经典',   url:'mario/index.html'},
  {id:'plane', name:'3D 单词飞行',    icon:'✈️', desc:'飞机收集字母 · 3D 立体',   url:'plane/index.html'}
];

// ===== 渲染列表 =====
const list=document.getElementById('list');
GAMES.forEach(g=>{
  const card=document.createElement('div');
  card.className='card';
  card.innerHTML=`<div class="icon">${g.icon}</div>
    <div class="info">
      <div class="name">${g.name}</div>
      <div class="desc">${g.desc}</div>
      <div class="url">${g.url}</div>
    </div>
    <div class="arrow">▶</div>`;
  card.addEventListener('click',()=>openGame(g));
  list.appendChild(card);
});

// ===== 打开游戏 =====
function openGame(g){
  document.getElementById('viewer').style.display='flex';
  document.getElementById('viewerTitle').textContent=g.name;
  const f=document.getElementById('frame');
  f.src='about:blank';
  setTimeout(()=>{f.src=g.url},50);
}
function closeGame(){
  const f=document.getElementById('frame');
  f.src='about:blank';
  document.getElementById('viewer').style.display='none';
}
function openInTab(){
  window.open(document.getElementById('frame').src,'_blank');
}
</script>
</body>
</html>
